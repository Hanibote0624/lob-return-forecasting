name: Correctness checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  correctness:
    name: Python 3.12 correctness (no GPU training)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements/core.txt
            requirements/core-constraints.txt
            requirements/dev.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements/dev.txt
      - name: Run correctness checks including synthetic Stage1-5 integration
        run: python scripts/check.py
      - name: Validate shell wrapper and preview the public configuration
        run: |
          bash -n run_all.sh
          python scripts/run_pipeline.py --config-path config/gp_lit_regression_v6_gpmain_64.example.json --dry-run
