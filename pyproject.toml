# Checkout-based research repository; this file configures development tools.
# Installation is through requirements/*.txt, not pip install .
[tool.ruff]
target-version = "py312"
line-length = 100
include = ["src/**/*.py", "scripts/**/*.py", "tests/**/*.py", "model_tests/**/*.py"]

[tool.ruff.lint]
# Correctness checks across both the main pipeline and archived experiments.
# Historical formatting is retained to keep scientific changes reviewable.
select = ["E9", "F63", "F7", "F82"]
